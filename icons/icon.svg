<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A6FB0"/>
      <stop offset="1" stop-color="#173B5E"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#F5B21B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- gear (mechanical) -->
  <g transform="translate(256 256)" fill="#FFFFFF">
    <g id="teeth">
      <rect x="-30" y="-152" width="60" height="52" rx="12"/>
    </g>
    <use href="#teeth" transform="rotate(45)"/>
    <use href="#teeth" transform="rotate(90)"/>
    <use href="#teeth" transform="rotate(135)"/>
    <use href="#teeth" transform="rotate(180)"/>
    <use href="#teeth" transform="rotate(225)"/>
    <use href="#teeth" transform="rotate(270)"/>
    <use href="#teeth" transform="rotate(315)"/>
    <circle r="118"/>
    <circle r="84" fill="url(#bg)"/>
  </g>
  <!-- lightning bolt (electrical) -->
  <path d="M276 160 L206 268 H252 L232 352 L308 236 H260 Z" fill="url(#bolt)" stroke="#173B5E" stroke-width="6" stroke-linejoin="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
