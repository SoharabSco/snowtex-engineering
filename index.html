<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Snowtex Engineering</title>
<meta name="description" content="SCO E&M KPI Management System">
<meta name="theme-color" content="#1F4E79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Snowtex Eng">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --blue: #1F4E79; --deep: #173B5E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--deep); font-family: "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #F3F5F8;
         padding-top: env(safe-area-inset-top); }

  /* splash while the app opens */
  #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            background: linear-gradient(135deg, #2A6FB0, #173B5E); color: #FFF; transition: opacity .5s ease; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash img { width: 108px; height: 108px; border-radius: 26px; box-shadow: 0 14px 34px rgba(0,0,0,.35); animation: pop .6s ease both; }
  #splash h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  #splash p { margin: -10px 0 0; font-size: 13px; opacity: .8; }
  .dots span { display: inline-block; width: 8px; height: 8px; margin: 0 3px; border-radius: 50%; background: #FFE27A; animation: blink 1s infinite; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }

  /* no internet */
  #offline { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
             background: #173B5E; color: #FFF; text-align: center; padding: 24px; }
  #offline.show { display: flex; }
  #offline button, .bar button { border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer; }
  #offline button { background: #FFE27A; color: #173B5E; }

  /* "Install" bar (first visits, until installed or closed) */
  .bar { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 30; display: none; align-items: center; gap: 10px;
         padding: 10px 12px; border-radius: 14px; background: #FFF; color: #1F2937; box-shadow: 0 12px 30px rgba(0,0,0,.25); font-size: 13px; max-width: 520px; margin: 0 auto; }
  .bar.show { display: flex; animation: up .35s ease both; }
  .bar img { width: 38px; height: 38px; border-radius: 9px; }
  .bar div { flex: 1; line-height: 1.35; }
  .bar .go { background: var(--blue); color: #FFF; }
  .bar .x { background: transparent; color: #6B7280; padding: 8px; }
  @keyframes up { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>

<div id="splash">
  <img src="icons/icon-192.png" alt="">
  <h1>Snowtex Engineering</h1>
  <p>E&amp;M KPI Management System</p>
  <div class="dots"><span></span><span></span><span></span></div>
</div>

<div id="offline">
  <div style="font-size:46px">📡</div>
  <h2 style="margin:0">No internet connection</h2>
  <p style="margin:0;opacity:.8">Snowtex Engineering needs the internet. Please check Wi-Fi or mobile data.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</div>

<div class="bar" id="installBar">
  <img src="icons/icon-192.png" alt="">
  <div id="installText"><b>Install Snowtex Engineering</b><br>Open it from your home screen like an app.</div>
  <button type="button" class="go" id="installGo">Install</button>
  <button type="button" class="x" id="installClose" aria-label="Close">✕</button>
</div>

<iframe id="app" title="Snowtex Engineering" allow="camera; microphone; clipboard-read; clipboard-write; geolocation; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
  // ===== THE APP (Google Apps Script web app) =====
  var APP_URL = "https://script.google.com/macros/s/AKfycbw3gaLqb_wHlQSkI45CioQ0HgVyZS92rV9iGnc-SJvKYZC2I2m3jw1lZMiswuwwMRW7/exec";

  // A machine QR sticker opens ...?m=ELE-0001 : pass it on to the app
  (function openApp() {
    var params = new URLSearchParams(location.search);
    var pass = new URLSearchParams();
    ["m", "machine"].forEach(function(k) { if (params.get(k)) pass.set(k, params.get(k)); });
    var query = pass.toString();
    var frame = document.getElementById("app");
    var splash = document.getElementById("splash");

    if (!navigator.onLine) { document.getElementById("offline").classList.add("show"); }

    frame.addEventListener("load", function() {
      setTimeout(function() { splash.classList.add("hide"); }, 300);
    });

    // never keep the splash forever
    setTimeout(function() { splash.classList.add("hide"); }, 12000);

    frame.src = APP_URL + (query ? "?" + query : "");
  })();

  window.addEventListener("offline", function() { document.getElementById("offline").classList.add("show"); });
  window.addEventListener("online", function() { document.getElementById("offline").classList.remove("show"); });

  // ===== background helper (makes it installable) =====
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() { navigator.serviceWorker.register("sw.js").catch(function() {}); });
  }

  // ===== "Install" bar =====
  (function installBar() {
    var bar = document.getElementById("installBar");
    var text = document.getElementById("installText");
    var go = document.getElementById("installGo");
    var installed = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    var closed = false;
    try { closed = localStorage.getItem("INSTALL_BAR_CLOSED") === "1"; } catch (e) {}

    if (installed || closed) return;

    var prompt = null;

    // Android / Chrome / Edge
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      prompt = e;
      setTimeout(function() { bar.classList.add("show"); }, 4000);
    });

    go.onclick = function() {
      if (!prompt) return;
      prompt.prompt();
      prompt.userChoice.finally(function() { bar.classList.remove("show"); prompt = null; });
    };

    document.getElementById("installClose").onclick = function() {
      bar.classList.remove("show");
      try { localStorage.setItem("INSTALL_BAR_CLOSED", "1"); } catch (e) {}
    };

    window.addEventListener("appinstalled", function() { bar.classList.remove("show"); });

    // iPhone / iPad (Safari has no install button): show how
    var iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (iOS) {
      text.innerHTML = "<b>Install Snowtex Engineering</b><br>Tap <b>Share</b> ⬆️ then <b>Add to Home Screen</b>.";
      go.style.display = "none";
      setTimeout(function() { bar.classList.add("show"); }, 4000);
    }
  })();
</script>

</body>
</html>
